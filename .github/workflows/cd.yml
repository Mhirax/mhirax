# Builds the site on every push to main and deploys it to Vercel production.
# Vercel's own Git auto-deploys are switched off in vercel.json, so this is the
# only pipeline that deploys (no duplicate or conflicting deployments).
#
# Required repository secrets (Settings > Secrets and variables > Actions):
#   VERCEL_TOKEN       - personal access token from vercel.com/account/tokens
#   VERCEL_ORG_ID      - "orgId" from .vercel/project.json after `npx vercel link`
#   VERCEL_PROJECT_ID  - "projectId" from the same file

name: CD

on:
  push:
    branches: [main]
  workflow_dispatch:

# never run two production deploys at the same time
concurrency:
  group: production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # fails fast before touching Vercel if the code doesn't build
      - name: Build
        run: npm run build

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Pull Vercel project settings
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}

      - name: Build for Vercel
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy to production
        run: vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}
